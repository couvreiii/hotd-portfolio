<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon's Forge - 3D Interactive Experience</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            font-family: 'Cinzel', serif; 
            background: #0a0a0a;
        }
        #canvas-container { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
        }
        #ui {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #d4af37;
            z-index: 10;
            pointer-events: none;
        }
        #ui h1 {
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }
        #ui p {
            font-size: 14px;
            opacity: 0.9;
        }
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #d4af37;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>Dragon's Forge</h1>
        <p>Interactive 3D Experience<br/>Drag to rotate • Scroll to zoom</p>
    </div>
    
    <div id="canvas-container"></div>
    
    <div class="controls">
        <p>Forged with Three.js & React</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
